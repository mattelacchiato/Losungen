name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Aktuelle Linux-SDK-URL bei Garmin nachschlagen und als Repo-Variable
      # CIQ_SDK_URL setzen (Settings → Variables → Actions). Pattern:
      # https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-<version>-<date>-<hash>.zip
      SDK_URL: ${{ vars.CIQ_SDK_URL }}
      SDK_DIR: ${{ github.workspace }}/.ciq-sdk
      DEV_KEY: ${{ github.workspace }}/.developer_key

    steps:
      - uses: actions/checkout@v4

      - name: Validate SDK URL is configured
        run: |
          if [ -z "$SDK_URL" ]; then
            echo "::error::Repository variable CIQ_SDK_URL not set."
            echo "Find the current Linux SDK URL at https://developer.garmin.com/connect-iq/sdk/ and add it as a repository variable named CIQ_SDK_URL."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Connect IQ SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ciq-sdk-${{ hashFiles('.github/workflows/build.yml') }}-${{ env.SDK_URL }}

      - name: Download Connect IQ SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$SDK_DIR"
          curl -fL --retry 4 --retry-delay 5 -o /tmp/ciq-sdk.zip "$SDK_URL"
          unzip -q /tmp/ciq-sdk.zip -d "$SDK_DIR"
          chmod +x "$SDK_DIR"/bin/*

      - name: Provision developer key
        env:
          DEV_KEY_B64: ${{ secrets.MONKEY_DEVELOPER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEV_KEY_B64:-}" ]; then
            echo "$DEV_KEY_B64" | base64 -d > "$DEV_KEY"
            echo "Using developer key from secret."
          else
            echo "::warning::Secret MONKEY_DEVELOPER_KEY_BASE64 not set; generating ephemeral key. The resulting .prg will not be reusable across builds."
            openssl genrsa -out /tmp/dev_key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER \
              -in /tmp/dev_key.pem -out "$DEV_KEY" -nocrypt
          fi
          chmod 600 "$DEV_KEY"

      - name: Verify data resource is up to date
        run: |
          set -euo pipefail
          unzip -o Losung_2026_XML.zip -d xml_extracted
          python3 tools/convert.py
          if ! git diff --quiet -- garmin/resources/jsonData/losungen.json; then
            echo "::error::garmin/resources/jsonData/losungen.json is out of sync with the XML source."
            git --no-pager diff --stat -- garmin/resources/jsonData/losungen.json
            exit 1
          fi

      - name: Build PRG
        run: |
          set -euo pipefail
          export PATH="$SDK_DIR/bin:$PATH"
          OUT="losung-nt-build-${{ github.run_number }}.prg"
          monkeyc \
            -o "$OUT" \
            -f garmin/monkey.jungle \
            -y "$DEV_KEY" \
            -d fr955 \
            -w \
            --release
          ls -la "$OUT"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Upload PRG artifact
        uses: actions/upload-artifact@v4
        with:
          name: losung-nt-build-${{ github.run_number }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: ${{ env.ARTIFACT }}
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
