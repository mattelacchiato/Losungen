<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1583cf"/>
      <stop offset="100%" stop-color="#08527f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="40%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>
  <rect width="500" height="500" fill="url(#vignette)"/>

  <!-- Open book centered around (250, 200) -->
  <g filter="url(#shadow)">
    <!-- Left page -->
    <path d="M 100 150 Q 175 125 248 150 L 248 290 Q 175 265 100 290 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 400 150 Q 325 125 252 150 L 252 290 Q 325 265 400 290 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Cross on the spine -->
    <rect x="240" y="172" width="20" height="100" rx="2" fill="#08527f"/>
    <rect x="215" y="206" width="70" height="20" rx="2" fill="#08527f"/>
  </g>

  <!-- App name -->
  <text x="250" y="410" font-family="Georgia, 'Times New Roman', serif"
        font-size="68" font-weight="bold" letter-spacing="1"
        text-anchor="middle" fill="#ffffff">Die Losungen</text>
</svg>
